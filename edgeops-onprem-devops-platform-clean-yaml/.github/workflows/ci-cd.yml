name: EdgeOps CI-CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: pip install -r services/api/requirements.txt
    - run: pytest -q
      working-directory: services/api

    - run: pip install -r services/worker/requirements.txt
    - run: pytest -q
      working-directory: services/worker

    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - run: npm ci
      working-directory: services/web

    - run: npm test
      working-directory: services/web

    - run: npm run build
      working-directory: services/web

  helm:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
    - run: helm lint helm/edgeops

  security:
    runs-on: ubuntu-latest
    needs: [test, helm]
    steps:
    - uses: actions/checkout@v4
    - uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: "1"

  build-push:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: services/api
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/edgeops-api:${{ github.sha }}

    - uses: docker/build-push-action@v6
      with:
        context: services/worker
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/edgeops-worker:${{ github.sha }}

    - uses: docker/build-push-action@v6
      with:
        context: services/agent
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/edgeops-agent:${{ github.sha }}

    - uses: docker/build-push-action@v6
      with:
        context: services/web
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/edgeops-web:${{ github.sha }}

  image-scan:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    steps:
    - uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/edgeops-api:${{ github.sha }}
        severity: HIGH,CRITICAL
        exit-code: "1"

  gitops:
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Update GitOps image tags
      run: |
        sed -i "s/tag: latest/tag: ${GITHUB_SHA}/g" helm/edgeops/values.yaml
        git config user.name github-actions
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add helm/edgeops/values.yaml
        git commit -m "chore: promote ${GITHUB_SHA}" || true
        git push
