apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeops-api
  namespace: edgeops
spec:
  podSelector:
    matchLabels:
      app: edgeops-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edgeops-web
        - podSelector:
            matchLabels:
              app: edgeops-agent
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeops-mongodb
  namespace: edgeops
spec:
  podSelector:
    matchLabels:
      app: edgeops-mongodb
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edgeops-api
        - podSelector:
            matchLabels:
              app: edgeops-worker
      ports:
        - protocol: TCP
          port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeops-kafka
  namespace: edgeops
spec:
  podSelector:
    matchLabels:
      app: edgeops-kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edgeops-api
        - podSelector:
            matchLabels:
              app: edgeops-worker
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeops-redis
  namespace: edgeops
spec:
  podSelector:
    matchLabels:
      app: edgeops-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: edgeops-api
      ports:
        - protocol: TCP
          port: 6379