name: EdgeOps CI-CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - run: pip install -r services/api/requirements.txt
    - run: pytest -q
      working-directory: services/api

    - run: pip install -r services/worker/requirements.txt
    - run: pytest -q
      working-directory: services/worker

    - uses: actions/setup-node@v4
      with:
        node-version: "20"

    - run: npm ci
      working-directory: services/web

    - run: npm test
      working-directory: services/web

    - run: npm run build
      working-directory: services/web

  helm:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - uses: azure/setup-helm@v4
      with:
        version: v3.15.4
    - run: helm lint helm/edgeops
    - run: helm template edgeops helm/edgeops > /tmp/rendered.yaml
    - name: kubeconform validation
      uses: docker://ghcr.io/yannh/kubeconform:latest
      with:
        args: -strict /tmp/rendered.yaml

  security:
    runs-on: ubuntu-latest
    needs: [test, helm]
    steps:
    - uses: actions/checkout@v4
    - uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs
        scan-ref: .
        severity: HIGH,CRITICAL
        exit-code: "1"

  build-push:
    runs-on: ubuntu-latest
    needs: security
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [api, worker, web, agent]
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/build-push-action@v6
      with:
        context: services/${{ matrix.service }}
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/edgeops-${{ matrix.service }}:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/edgeops-${{ matrix.service }}:latest

  image-scan:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    strategy:
      matrix:
        service: [api, worker, web, agent]
    steps:
    - uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ghcr.io/${{ github.repository_owner }}/edgeops-${{ matrix.service }}:${{ github.sha }}
        severity: HIGH,CRITICAL
        exit-code: "1"

  gitops:
    runs-on: ubuntu-latest
    needs: image-scan
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up yq
      uses: mikefarah/yq@v4.44.3

    - name: Bump image tags in values.yaml to this commit's SHA
      run: |
        set -e
        for svc in api worker web agent; do
          yq -i ".${svc}.image.tag = \"${{ github.sha }}\"" helm/edgeops/values.yaml
        done

    - name: Commit and push updated manifests
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: promote ${{ github.sha }}"
        file_pattern: helm/edgeops/values.yaml